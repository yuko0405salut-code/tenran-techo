name: Update official exhibitions
on:
  workflow_dispatch:
  schedule:
    - cron: '17 21 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: exhibition-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python collect.py
      - name: Save refreshed catalog
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data.js
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh official exhibition dates'
            git push
          fi
      - name: Prepare website
        run: |
          mkdir -p _site
          cp index.html style.css data.js app-backup-v3.js _site/
          if [ -f apple-touch-icon.png ]; then cp apple-touch-icon.png _site/; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
